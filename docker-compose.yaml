services:
  postgres:
    image: postgres:16
    container_name: event-ticket-postgres
    environment:
      POSTGRES_DB: eventticketdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: welcome
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5433:5432"
    # Keep the original mount path to remain compatible with the user's existing volume.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventticketdb"]
      interval: 5s  #every 5s it will start actuator check
      timeout: 5s   #every 5s it will stop  actuator check
      retries: 10  #every 10s we will telling that health is not good to actuator

volumes:
  postgres_data:
