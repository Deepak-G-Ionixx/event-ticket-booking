# Active only when SPRING_PROFILES_ACTIVE=docker (set in compose.yaml).
# Contains no secrets. Every sensitive value comes from environment variables.

# The hostname "postgres" is the compose service name.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.show-sql=false

# Liquibase creates and updates the schema on startup.
spring.liquibase.enabled=true

# The container health check only needs the status.
management.endpoint.health.show-details=never

# Let in-flight requests finish when the container stops.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s