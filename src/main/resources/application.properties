
# ==========================================================
# Application
# ==========================================================
spring.application.name=event-ticket-booking


# ==========================================================
# Database - PostgreSQL
# Values are supplied through environment variables.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eventticketdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================================
# JPA / Hibernate
# Liquibase manages the database schema.
# Hibernate validates the schema instead of creating tables.
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


# ==========================================================
# Liquibase
# Runs database changesets during application startup.
# ==========================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml


# ==========================================================
# Actuator
# Expose only the health endpoint over HTTP.
# ==========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized


# ==========================================================
# Error response protection
# Avoid exposing exception messages and stack traces by default.
# ==========================================================
server.error.include-message=never
server.error.include-stacktrace=never


# ==========================================================
# Security / JWT
# IMPORTANT: JWT_SECRET must be provided as an environment
# variable. Do not commit the actual signing secret to Git.
# ==========================================================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:60m}
app.security.jwt.issuer=${JWT_ISSUER:event-ticket-booking}


# ==========================================================
# Demo users
# Disabled by default. Enable only in a controlled
# development environment when demo accounts are needed.
# ==========================================================
app.security.seed-demo-users=${SEED_DEMO_USERS:false}



# ==========================================================
# Email - Password Reset
# Supply SMTP credentials through environment variables.
# ==========================================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP authentication and TLS.
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true

# Password-reset email settings.
app.security.password-reset.from=${MAIL_FROM:no-reply@example.com}
app.security.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}


management.health.mail.enabled=false